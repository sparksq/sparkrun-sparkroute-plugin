[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkrun-sparkroute-plugin"
version = "0.1.1"
description = "First-party SparkRoute integration for sparkrun"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "LICENSE_EXCEPTION", "NOTICE", "LICENSES/*.txt"]
requires-python = ">=3.12"
dependencies = ["sparkrun>=0.3.8,<0.4"]

[project.urls]
Homepage = "https://github.com/sparksq/sparkrun-sparkroute-plugin"
Issues = "https://github.com/sparksq/sparkrun-sparkroute-plugin/issues"
Source = "https://github.com/sparksq/sparkrun-sparkroute-plugin"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sparkrun.plugins.sparkroute*"]
namespaces = true

[tool.setuptools.package-data]
"sparkrun.plugins.sparkroute" = ["LICENSE", "LICENSE_EXCEPTION", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pytest==9.0.3",
    "ruff==0.15.9",
]
