sparkrun-sparkroute-plugin: 0.1.1
sparkroute: 0.0.2

project_rules:
  sparkrun-sparkroute-plugin:
    - {type: pyproject, path: pyproject.toml}
    - {type: init_py, path: src/sparkrun/plugins/sparkroute/__init__.py}
  sparkroute:
    - {type: init_py, path: src/sparkrun/plugins/sparkroute/_gateway_version.py}

preferred_versions:
  python:
    ruff: "0.15.9"

ci:
  repo_tools_source: "git+https://github.com/scitrera/repo-tools.git@4a2ae8b966a875f6dc21ec8c142220a0471e06e8"
  test_branches: [main]
  push_branches: [main]
  only_workflows: [version-check, test-python]
  python:
    test_versions: ["3.12", "3.13"]
    install: python scripts/prepare-ci-host.py && uv pip install --system -e .dev/sparkrun-with-sparkroute -e . --group dev
    test_command: python -m pytest -v
    extra_steps:
      - name: Verify versions are in sync
        run: python scripts/update-versions.py --check
      - name: Verify generated workflows
        run: python scripts/generate-ci-gha.py --check
